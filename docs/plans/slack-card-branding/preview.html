<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flux notification card preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#1a1d21;color:#e8e8ed;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:820px;padding:28px;margin:auto}.note{font-size:13px;color:#a8abb2;margin:0 0 24px}.message{padding:0 0 10px}.identity{display:flex;align-items:center;gap:7px;font-size:13px;color:#c7c9ce;margin-bottom:10px}.logo{width:22px;height:22px;display:grid;place-items:center;background:white;border-radius:4px;font-size:17px}.title{font-weight:700;font-size:18px;overflow-wrap:anywhere}.context{font-size:13px;color:#a8abb2;margin:12px 0}hr{border:0;border-top:1px solid #35383e;margin:18px 0}.section{white-space:pre-wrap}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.button{font-weight:600;border:1px solid #70737a;border-radius:5px;padding:7px 12px;font-size:14px}.primary{background:#087f5b;border-color:#087f5b;color:white}.light{background:white;color:#1d1c1d}.light .context,.light .identity,.light .note{color:#616061}.light .message,.light hr{border-color:#ddd}@media(max-width:500px){main{padding:18px}.title{font-size:17px}.message{padding:18px 0}}
</style><main><p class="note">Illustrative preview from the renderer’s Block Kit payload. Synthetic task details and placeholder fox icon; Slack controls final spacing.</p><div id="cards"></div></main><script>
const payload={"blocks": [{"type": "divider"}, {"elements": [{"alt_text": "Flux", "image_url": "https://cdn.example/flux.png", "type": "image"}, {"emoji": true, "text": "Flux", "type": "plain_text"}], "type": "context"}, {"elements": [{"elements": [{"style": {"bold": true}, "text": "#123 \u00b7 Fix source package dependency resolution", "type": "text"}], "type": "rich_text_section"}], "type": "rich_text"}, {"elements": [{"emoji": true, "text": "Engineering \u00b7 example/project", "type": "plain_text"}], "type": "context"}, {"text": {"emoji": true, "text": "\ud83d\udfe3 Ready for review\nWork finished in Build. Review the result and move the card to Test when ready. Independent validation is still required.", "type": "plain_text"}, "type": "section"}, {"elements": [{"action_id": "open_workfloor", "style": "primary", "text": {"emoji": true, "text": "Open in Workfloor", "type": "plain_text"}, "type": "button", "url": "https://workfloor.example/?workspaceId=demo&taskId=example&sessionId=preview"}, {"action_id": "open_issue", "text": {"emoji": true, "text": "View issue", "type": "plain_text"}, "type": "button", "url": "https://github.com/example/project/issues/123"}], "type": "actions"}, {"elements": [{"emoji": true, "text": "Reply in this thread to continue this card. Questions and permissions must be answered in Workfloor.", "type": "plain_text"}], "type": "context"}], "text": "Flux\n#123 \u00b7 Fix source package dependency resolution\nEngineering \u00b7 example/project\n\ud83d\udfe3 Ready for review\nWork finished in Build. Review the result and move the card to Test when ready. Independent validation is still required.\nhttps://workfloor.example/?workspaceId=demo&taskId=example&sessionId=preview\nhttps://github.com/example/project/issues/123\n\nReply in this thread to continue this card. Questions and permissions must be answered in Workfloor."};
const root=document.getElementById('cards');
for(let i=0;i<2;i++){let card=document.createElement('article');card.className='message';root.append(card);for(const b of payload.blocks){let e=document.createElement('div');card.append(e);if(b.type==='context'){e.className='context';if(b.elements.some(x=>x.type==='image')){e.className='identity';let img=document.createElement('span');img.className='logo';img.textContent='🦊';img.setAttribute('aria-label','Flux icon placeholder');e.append(img)}let text=document.createElement('span');text.textContent=b.elements.filter(x=>x.type==='plain_text').map(x=>x.text).join(' ');e.append(text)}if(b.type==='rich_text'){e.className='title';e.textContent=b.elements[0].elements.map(x=>x.text).join('')}if(b.type==='divider')e.append(document.createElement('hr'));if(b.type==='section'){e.className='section';e.textContent=b.text.text}if(b.type==='actions'){e.className='actions';for(const a of b.elements){let btn=document.createElement('span');btn.className='button '+(a.style==='primary'?'primary':'');btn.textContent=a.text.text;e.append(btn)}}}}
if(location.hash==='#light')document.body.classList.add('light');
</script></html>
