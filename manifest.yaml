id: "kandev-plugin-slack"
api_version: 1
version: "0.2.2"
display_name: "Slack"
description: "Turn Slack conversations into Kandev tasks. Mention @Kandev or run /kandev and a utility agent triages the thread into the right workspace, workflow and column, then replies in-thread."
author: "kandev"
categories: ["connector", "automation"]
repo_url: "https://github.com/kdlbs/kandev-plugin-slack"

runtime:
  type: binary
  executables:
    linux-amd64: "server/plugin-linux-amd64"
    linux-arm64: "server/plugin-linux-arm64"
    darwin-amd64: "server/plugin-darwin-amd64"
    darwin-arm64: "server/plugin-darwin-arm64"
    windows-amd64: "server/plugin-windows-amd64.exe"

capabilities:
  # The poll watermark (per-channel last-seen Slack ts) and the last probe
  # result live in Host state so a restart resumes instead of re-triaging.
  state: true
  # Credentials arrive through config_schema secret fields; GetConfig hands
  # the subprocess the cleartext values.
  secrets: true
  # Triage is one non-interactive completion per matched message.
  agent_invoke: true
  # The triage prompt is built from the real Kandev topology so the agent
  # picks an existing workspace/workflow/column rather than inventing one.
  api_read: ["workspaces", "workflows", "repositories"]
  api_write: ["tasks"]

webhooks:
  - key: "status"
    description: "Connection status, detected auth mode, and recent triage activity (UI relay, not an external webhook)"
    method: "GET"
  - key: "test"
    description: "Probe the stored credentials with Slack auth.test (UI relay, not an external webhook)"
    method: "POST"
  - key: "scan"
    description: "Run one fallback-mode scan immediately instead of waiting for the next poll (UI relay, not an external webhook)"
    method: "POST"

config_schema:
  type: object
  properties:
    app_token:
      type: string
      secret: true
      title: "App-level token"
      description: "xapp- token from Basic Information > App-Level Tokens, with the connections:write scope. Opens the Socket Mode connection so Slack can push events without Kandev needing a public URL."
    bot_token:
      type: string
      secret: true
      title: "Bot token"
      description: "xoxb- Bot User OAuth Token from OAuth & Permissions, after installing the app. This is the identity replies come from."
    utility_agent:
      type: string
      format: utility-agent
      title: "Triage agent"
      description: "The utility agent that reads the Slack thread and decides which workspace, workflow and column the task belongs in."
    start_agent:
      type: boolean
      default: false
      title: "Start agent on the new task"
      description: "Launch an agent on the task as soon as triage creates it, instead of leaving it queued on the board."
    session_token:
      type: string
      secret: true
      title: "Fallback: browser session token"
      description: "Only if your workspace forbids app installs. The xoxc- token from a logged-in Slack tab. Unofficial and unsupported by Slack; polls instead of receiving events. Leave empty when using a Slack app."
    session_cookie:
      type: string
      secret: true
      title: "Fallback: browser d cookie"
      description: "The `d` cookie from the same Slack tab as the session token. Required only for the fallback."
    command_prefix:
      type: string
      default: "!kandev"
      title: "Fallback: command prefix"
      description: "Fallback only. Messages starting with this marker are triaged. A Slack app is addressed with @Kandev or /kandev instead, so this is ignored."
    channels:
      type: string
      title: "Fallback: channels"
      description: "Fallback only. Comma-separated channel IDs to narrow the search. A Slack app receives events for every channel it is invited to."
    poll_interval_seconds:
      type: integer
      default: 30
      title: "Fallback: poll interval (seconds)"
      description: "Fallback only, between 5 and 600. A Slack app is event-driven and never polls."
  required: ["utility_agent"]

ui:
  bundle: "/ui/bundle.js"
