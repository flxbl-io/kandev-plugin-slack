id: "kandev-plugin-slack"
api_version: 1
version: "0.6.0"
min_kandev_version: "0.95.0"
display_name: "Slack"
description: "Turn Slack conversations into Kandev tasks. Mention @Kandev or run /kandev and a utility agent triages the thread into the right workspace, workflow and column, then replies in-thread."
author: "kandev"
categories: ["connector", "automation"]
repo_url: "https://github.com/flxbl-io/kandev-plugin-slack"
icon: "assets/icon.svg"

runtime:
  type: binary
  executables:
    linux-amd64: "server/plugin-linux-amd64"
    linux-arm64: "server/plugin-linux-arm64"
    darwin-amd64: "server/plugin-darwin-amd64"
    darwin-arm64: "server/plugin-darwin-arm64"
    windows-amd64: "server/plugin-windows-amd64.exe"

capabilities:
  # The poll watermark (per-channel last-seen Slack ts) and the last probe
  # result live in Host state so a restart resumes instead of re-triaging.
  state: true
  # Credentials arrive through config_schema secret fields; GetConfig hands
  # the subprocess the cleartext values.
  secrets: true
  # Triage is one non-interactive completion per matched message.
  agent_invoke: true
  # The triage prompt is built from the real Kandev topology so the agent
  # picks an existing workspace/workflow/column rather than inventing one.
  api_read: ["workspaces", "workflows", "repositories", "conversations", "tasks", "sessions", "interactions", "attention", "assistant"]
  api_write: ["tasks", "conversations", "assistant"]

agent_tools:
  - name: notify_user
    description: Send a DM to one verified Slack user using the configured bot. Supply optional card metadata for an issue-first card with navigation buttons. Reuse the same idempotency key for the same notification; never retry an unknown delivery with a new key.
    surfaces: [kanban-task, office-task]
    input_schema:
      type: object
      properties:
        user_id:
          type: string
          pattern: '^[UW][A-Z0-9]{8,63}$'
        text:
          type: string
          minLength: 1
          maxLength: 4000
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 200
        card:
          type: object
          description: Optional task card. Requires the configured Workfloor public origin. Supply current verified facts; never infer CI success. Existing notifications must reuse their original arguments.
          properties:
            title: {type: string, minLength: 1, maxLength: 500, description: Full issue or task title without an issue-number prefix.}
            workspace_name: {type: string, minLength: 1, maxLength: 100}
            attention: {type: string, enum: [input, review, error]}
            summary: {type: string, minLength: 1, maxLength: 1200}
            workfloor_url: {type: string, minLength: 1, maxLength: 800, description: HTTPS URL with workspaceId, taskId and sessionId.}
            repository: {type: string, minLength: 1, maxLength: 200}
            issue_number: {type: integer, minimum: 1}
            issue_url: {type: string, minLength: 1, maxLength: 800}
            pr_url: {type: string, minLength: 1, maxLength: 800}
          required: [title, workspace_name, attention, summary, workfloor_url]
          additionalProperties: false
      required: [user_id, text, idempotency_key]
      additionalProperties: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: true

  - name: notify_task_user
    description: Notify the current mapped human assignee about an explicit card and bind replies to its current session. Reuse the same key for the same notification. Never retry uncertain delivery with a new key.
    surfaces: [kanban-task, office-task]
    input_schema:
      type: object
      properties:
        user_id: {type: string, pattern: '^[UW][A-Z0-9]{8,63}$'}
        task_id: {type: string, minLength: 1}
        session_id: {type: string, minLength: 1}
        text: {type: string, minLength: 1, maxLength: 3500}
        idempotency_key: {type: string, minLength: 1, maxLength: 160}
        card:
          type: object
          description: Optional task card. Requires the configured Workfloor public origin. Supply current verified facts; never infer CI success. Existing notifications must reuse their original arguments.
          properties:
            title: {type: string, minLength: 1, maxLength: 500, description: Full issue or task title without an issue-number prefix.}
            workspace_name: {type: string, minLength: 1, maxLength: 100}
            attention: {type: string, enum: [input, review, error]}
            summary: {type: string, minLength: 1, maxLength: 1200}
            workfloor_url: {type: string, minLength: 1, maxLength: 800, description: HTTPS URL with workspaceId, taskId and sessionId.}
            repository: {type: string, minLength: 1, maxLength: 200}
            issue_number: {type: integer, minimum: 1}
            issue_url: {type: string, minLength: 1, maxLength: 800}
            pr_url: {type: string, minLength: 1, maxLength: 800}
          required: [title, workspace_name, attention, summary, workfloor_url]
          additionalProperties: false
      required: [user_id, task_id, session_id, text, idempotency_key]
      additionalProperties: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: true

webhooks:
  - key: "status"
    description: "Connection status, detected auth mode, and recent triage activity (UI relay, not an external webhook)"
    method: "GET"
  - key: "test"
    description: "Probe the stored credentials with Slack auth.test (UI relay, not an external webhook)"
    method: "POST"
  - key: "scan"
    description: "Run one fallback-mode scan immediately instead of waiting for the next poll (UI relay, not an external webhook)"
    method: "POST"

config_schema:
  type: object
  properties:
    digests_enabled:
      type: boolean
      default: false
      title: Personal daily digests
      description: Allow mapped people to choose their own daily Slack digest time by DM. Requires the read-only Attention Host API; nobody is opted in automatically.
    conversations_enabled:
      type: boolean
      default: false
      title: Card conversations
      description: Enable private replies to bound card notification threads. Requires the conversation Host API and an operator-managed user mapping.
    conversation_team_id:
      type: string
      title: Conversation Slack team ID
    conversation_app_id:
      type: string
      title: Conversation Slack app ID
    conversation_users:
      type: string
      title: Conversation user mapping
      description: 'JSON object mapping TEAM_ID:SLACK_USER_ID to a Workfloor user ID. Example: {"T12345678:U12345678":"workfloor-user-id"}.'
    workfloor_url:
      type: string
      title: Workfloor public origin
      description: HTTPS origin used for authorized card links, without a path or query string.
    app_token:
      type: string
      secret: true
      title: "App-level token"
      description: "xapp- token from Basic Information > App-Level Tokens, with the connections:write scope. Opens the Socket Mode connection so Slack can push events without Kandev needing a public URL."
    bot_token:
      type: string
      secret: true
      title: "Bot token"
      description: "xoxb- Bot User OAuth Token from OAuth & Permissions, after installing the app. This is the identity replies come from."
    general_chat_enabled:
      type: boolean
      default: false
      title: General direct messages
      description: Allow linked people to check their tasks and create work from a DM. Requires a host with the assistant API.
    general_chat_agent_profile_id:
      type: string
      format: agent-profile
      title: General DM agent profile
      description: The agent profile used to understand DMs. Choose a utility-compatible profile. Task execution uses the selected workflow's own profile.
    general_chat_start_agent:
      type: boolean
      default: true
      title: Start tasks created in DMs
      description: Start the selected workflow after creation, unless the person explicitly asks to queue it. Disable to create tasks without launching an agent.
    utility_agent:
      type: string
      format: utility-agent
      title: "Triage agent"
      description: "The utility agent that reads the Slack thread and decides which workspace, workflow and column the task belongs in."
    start_agent:
      type: boolean
      default: false
      title: "Start agent on the new task"
      description: "Launch an agent on the task as soon as triage creates it, instead of leaving it queued on the board."
    session_token:
      type: string
      secret: true
      title: "Fallback: browser session token"
      description: "Only if your workspace forbids app installs. The xoxc- token from a logged-in Slack tab. Unofficial and unsupported by Slack; polls instead of receiving events. Leave empty when using a Slack app."
    session_cookie:
      type: string
      secret: true
      title: "Fallback: browser d cookie"
      description: "The `d` cookie from the same Slack tab as the session token. Required only for the fallback."
    command_prefix:
      type: string
      default: "!kandev"
      title: "Fallback: command prefix"
      description: "Fallback only. Messages starting with this marker are triaged. A Slack app is addressed with @Kandev or /kandev instead, so this is ignored."
    channels:
      type: string
      title: "Fallback: channels"
      description: "Fallback only. Comma-separated channel IDs to narrow the search. A Slack app receives events for every channel it is invited to."
    poll_interval_seconds:
      type: integer
      default: 30
      title: "Fallback: poll interval (seconds)"
      description: "Fallback only, between 5 and 600. A Slack app is event-driven and never polls."
  required: ["utility_agent"]

ui:
  bundle: "/ui/bundle.js"
